version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-music-generator-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      CORS_ORIGIN: http://localhost:8081,http://localhost:5173
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 30
      MAX_DURATION_SECONDS: 60
      MIN_DURATION_SECONDS: 5
      AUDIO_STORAGE_DIR: /app/tmp/audio
      AUDIO_FILE_TTL_MS: 1800000
    volumes:
      - audio-tmp:/app/tmp/audio
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sonora-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: ai-music-generator-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"
    networks:
      - sonora-net

networks:
  sonora-net:
    driver: bridge

volumes:
  audio-tmp:
    driver: local
